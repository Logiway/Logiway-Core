services:
  graphhopper:
    build:
      context: ./Logiway-BE/graphhopper
    expose:
      - "8989"
    volumes:
      - graphhopper-cache:/app/graph-cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8989/health"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20m
    restart: unless-stopped
    networks:
      - routing
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./Logiway-BE
    environment:
      PORT: "6767"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_TIMEOUT_MS: "${GEMINI_TIMEOUT_MS:-30000}"
      GRAPHHOPPER_URL: http://graphhopper:8989/route
      GRAPHHOPPER_TIMEOUT_MS: "${GRAPHHOPPER_TIMEOUT_MS:-120000}"
      NOMINATIM_URL: "${NOMINATIM_URL:-https://nominatim.openstreetmap.org/search}"
      OVERPASS_URLS: "${OVERPASS_URLS:-${OVERPASS_URL:-https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter}}"
      OVERPASS_TIMEOUT_MS: "${OVERPASS_TIMEOUT_MS:-12000}"
      REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-15000}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:8001}"
    expose:
      - "6767"
    depends_on:
      graphhopper:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
      - routing
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  frontend:
    build:
      context: ./Logiway-FE
    ports:
      - "${FRONTEND_PORT:-8001}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ai-generator:
    profiles:
      - tools
    build:
      context: ./Logiway-AI
    command:
      - --count
      - "260"
      - --seed
      - "2026"
      - --output
      - /output/train_data.jsonl
    volumes:
      - ./Logiway-AI/data:/output
    network_mode: none
    restart: "no"

volumes:
  graphhopper-cache:

networks:
  edge:
  routing:
    internal: true
