[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "logiway-ai"
version = "1.0.0"
description = "Deterministic synthetic Indonesian logistics dataset generator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Proprietary"}
authors = [{name = "Logiway"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "ruff>=0.11"
]

[project.scripts]
logiway-ai = "logiway_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/logiway_ai"]

[tool.hatch.build.targets.wheel.force-include]
"src/logiway_ai/data/regulation_catalog.json" = "logiway_ai/data/regulation_catalog.json"
"src/logiway_ai/data/regulation_catalog.schema.json" = "logiway_ai/data/regulation_catalog.schema.json"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["logiway_ai"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
